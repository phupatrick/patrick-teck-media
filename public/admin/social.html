<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patrick Tech Social Queue</title>
<style>
:root{color-scheme:light;--ink:#17212b;--muted:#5d6b75;--line:#ccd5dc;--accent:#1769aa;--danger:#b42318;--surface:#fff}*{box-sizing:border-box}body{font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;max-width:980px;margin:0 auto;padding:clamp(20px,5vw,52px) 18px;color:var(--ink);background:#f5f8fb}h1{font-size:clamp(1.65rem,4vw,2.35rem);line-height:1.15;margin:0 0 8px}p{margin:0 0 18px}.intro{color:var(--muted)}.toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end;background:var(--surface);border:1px solid var(--line);padding:18px;border-radius:10px;box-shadow:0 8px 24px #17212b0d}label{display:grid;gap:6px;font-weight:700}input{width:100%;padding:11px 12px;border:1px solid #9eabb5;border-radius:6px;font:inherit}button{min-height:44px;padding:10px 16px;border:0;border-radius:6px;background:var(--accent);color:#fff;font:inherit;font-weight:700;cursor:pointer}button:hover,button:focus-visible{background:#0d4e82}button:focus-visible,input:focus-visible{outline:3px solid #8bc7f5;outline-offset:2px}#status{min-height:28px;margin:18px 0 8px;color:var(--muted)}#output{display:grid;gap:14px}article{border:1px solid var(--line);padding:18px;margin:0;border-radius:8px;background:var(--surface)}article h2{font-size:1.15rem;line-height:1.3;margin:0 0 5px}small{color:var(--muted)}article p{white-space:pre-wrap;margin:14px 0 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;background:#f1f5f8;border-radius:6px;color:#314552}.error{color:var(--danger);font-weight:700}@media(max-width:600px){.toolbar{grid-template-columns:1fr}button{width:100%}}
</style></head>
<body><h1>Hàng đợi đăng Facebook</h1><p class="intro">Trang quản trị chỉ hiển thị khi bạn có token OpenClaw hợp lệ. Nội dung đang chờ duyệt sẽ được hiển thị rõ theo từng bài.</p><div class="toolbar"><label for="token">Token quản trị OpenClaw<input id="token" type="password" autocomplete="off" aria-describedby="token-help"><span id="token-help" class="intro">Token được dùng cho request hiện tại và không lưu vào trình duyệt.</span></label><button id="load" type="button">Tải hàng đợi</button></div><p id="status" role="status" aria-live="polite"></p><main id="output"></main>
<script>const output=document.querySelector("#output"),status=document.querySelector("#status"),token=document.querySelector("#token");document.querySelector("#load").onclick=async()=>{status.textContent="Đang tải hàng đợi...";output.replaceChildren();try{const response=await fetch("/api/social/queue",{headers:{Authorization:`Bearer ${token.value}`}});const data=await response.json();if(!response.ok)throw new Error(data.error||"Không tải được hàng đợi.");status.textContent=`${data.pending.length} bài đang chờ duyệt.`;output.innerHTML=data.pending.length?data.pending.map(post=>`<article><h2>${escapeHtml(post.topic)}</h2><small>${escapeHtml(post.created_at||"")}</small><p>${escapeHtml(post.caption)}</p>${post.first_comment?`<pre>${escapeHtml(post.first_comment)}</pre>`:""}</article>`).join(""):"<p>Hàng đợi đang trống.</p>"}catch(error){status.textContent="Không thể tải hàng đợi.";output.innerHTML=`<p class="error">${escapeHtml(error.message)}</p>`}};function escapeHtml(value){return String(value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[char]))}</script></body>
</html>
