<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patrick Tech Social Queue</title>
<style>body{font:16px system-ui,sans-serif;max-width:900px;margin:40px auto;padding:0 18px;color:#17212b}button{padding:9px 14px;margin:4px 0;cursor:pointer}textarea,input{width:100%;box-sizing:border-box;padding:10px;margin:6px 0 12px}article{border:1px solid #ccd5dc;padding:16px;margin:12px 0;border-radius:6px}small{color:#5d6b75}.error{color:#b42318}</style></head>
<body><h1>Social publishing queue</h1><p>Dashboard nay chi hien thi khi request co token quan tri OpenClaw.</p><label>OpenClaw control token<input id="token" type="password" autocomplete="off"></label><button id="load">Tai hang doi</button><main id="output"></main>
<script>const output=document.querySelector("#output");document.querySelector("#load").onclick=async()=>{output.textContent="Dang tai...";try{const response=await fetch("/api/social/queue",{headers:{Authorization:`Bearer ${document.querySelector("#token").value}`}});const data=await response.json();if(!response.ok)throw new Error(data.error||"Khong tai duoc");output.innerHTML=data.pending.length?data.pending.map(post=>`<article><h2>${escapeHtml(post.topic)}</h2><small>${escapeHtml(post.created_at||"")}</small><p>${escapeHtml(post.caption)}</p><pre>${escapeHtml(post.first_comment||"")}</pre></article>`).join(""):"<p>Hang doi dang trong.</p>"}catch(error){output.innerHTML=`<p class="error">${escapeHtml(error.message)}</p>`}};function escapeHtml(value){return String(value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[char]))}</script></body>
</html>
