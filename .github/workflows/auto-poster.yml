name: X Auto Poster

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
  push:
    paths:
      - "data/openclaw-pending-clusters.json"

permissions:
  contents: write

jobs:
  auto-poster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate and publish X posts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://patricktechmedia.com' }}
        run: node scripts/auto-poster.mjs
      - name: Commit posted history
        run: |
          if git diff --quiet -- data/posted-history.json; then
            echo "No posting history changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posted-history.json
          git commit -m "chore: update X posted history"
          git push
