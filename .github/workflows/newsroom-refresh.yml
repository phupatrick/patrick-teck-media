name: OpenClaw Manager Cycle

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Who requested this run"
        required: false
        default: "manual"
      reason:
        description: "Short run reason"
        required: false
        default: ""
      article_url:
        description: "Single source URL submitted from Telegram"
        required: false
        default: ""
      repair_audit:
        description: "Run automatic audit repair before publishing"
        required: false
        default: ""
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: openclaw-manager-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run test gate before live data refresh
        run: npm test

      - name: Wake Vercel webhook self-registration
        continue-on-error: true
        env:
          SITE_URL: https://patricktechmedia.com
        run: |
          curl --fail --silent --show-error --location --user-agent "github-actions-newsroom-wake" "${SITE_URL%/}/vi/" > /dev/null

      - name: Pull production view snapshot
        continue-on-error: true
        env:
          SITE_URL: https://patricktechmedia.com
          PLATFORM_STATE_PATH: data/platform-state.json
        run: npm run platform:views:sync

      - name: Run OpenClaw manager
        env:
          NEWSROOM_PULL_URL: ${{ secrets.NEWSROOM_PULL_URL }}
          NEWSROOM_PULL_TOKEN: ${{ secrets.NEWSROOM_PULL_TOKEN }}
          NEWSROOM_SINGLE_URL: ${{ github.event.inputs.article_url || '' }}
          NEWSROOM_AUDIT_REPAIR: ${{ github.event.inputs.repair_audit || '' }}
          OPENCLAW_RUN_SOURCE: ${{ github.event.inputs.source || 'schedule' }}
          OPENCLAW_RUN_REASON: ${{ github.event.inputs.reason || 'scheduled' }}
          NEWSROOM_AUTOPUBLISH_STRICT: "1"
          OPENCLAW_NEWSROOM_URL: ${{ secrets.OPENCLAW_NEWSROOM_URL }}
          OPENCLAW_NEWSROOM_TOKEN: ${{ secrets.OPENCLAW_NEWSROOM_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEWSROOM_CONTENT_PATH: data/newsroom-content.json
          OPENCLAW_WEB_STATE_PATH: data/openclaw-web-state.json
          OPENCLAW_LEARNING_STATE_PATH: data/openclaw-learning-state.json
          PLATFORM_STATE_PATH: data/platform-state.json
          OPENCLAW_MANAGER_STATE_PATH: data/openclaw-manager-state.json
        run: node scripts/openclaw-manager.mjs

      - name: Sync generated data to cloud storage
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEWSROOM_CONTENT_PATH: data/newsroom-content.json
          OPENCLAW_WEB_STATE_PATH: data/openclaw-web-state.json
          OPENCLAW_LEARNING_STATE_PATH: data/openclaw-learning-state.json
          PLATFORM_STATE_PATH: data/platform-state.json
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is not configured; skipping storage sync."
            exit 0
          fi
          npm run storage:sync

      - name: Verify and publish OpenClaw changes
        env:
          OPENCLAW_GIT_AUTOPUSH: "1"
          OPENCLAW_GIT_USER_NAME: "github-actions[bot]"
          OPENCLAW_GIT_USER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
          OPENCLAW_GIT_COMMIT_MESSAGE: "Run OpenClaw manager cycle"
          OPENCLAW_GIT_SKIP_TESTS: "1"
        run: node scripts/openclaw-git-sync.mjs

      - name: Report newsroom status to Telegram
        if: ${{ always() }}
        env:
          TELEGRAM_NEWSROOM_BOT_TOKEN: ${{ secrets.TELEGRAM_NEWSROOM_BOT_TOKEN }}
          TELEGRAM_NEWSROOM_REPORT_CHAT_IDS: ${{ secrets.TELEGRAM_NEWSROOM_REPORT_CHAT_IDS }}
          SITE_URL: https://patricktechmedia.com
          NEWSROOM_CONTENT_PATH: data/newsroom-content.json
          OPENCLAW_MANAGER_STATE_PATH: data/openclaw-manager-state.json
          OPENCLAW_LEARNING_STATE_PATH: data/openclaw-learning-state.json
        run: |
          if [ -z "$TELEGRAM_NEWSROOM_BOT_TOKEN" ] || [ -z "$TELEGRAM_NEWSROOM_REPORT_CHAT_IDS" ]; then
            echo "Telegram report env is not configured; skipping report."
            exit 0
          fi
          node scripts/telegram-newsroom-report.mjs
