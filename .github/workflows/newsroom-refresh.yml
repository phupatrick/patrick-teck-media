name: OpenClaw Manager Cycle

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
  workflow_dispatch:
    inputs:
      source:
        description: "Who requested this run"
        required: false
        default: "manual"
      reason:
        description: "Short run reason"
        required: false
        default: ""
      article_url:
        description: "Single source URL submitted from Telegram"
        required: false
        default: ""
      repair_audit:
        description: "Run automatic audit repair before publishing"
        required: false
        default: ""
      publish_pair:
        description: "Require a VI/EN pair for this manually requested run"
        required: false
        default: ""
  schedule:
    - cron: "*/15 * * * *"
    - cron: "17 0 * * *"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: openclaw-manager-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run test gate before live data refresh
        run: npm test

      - name: Wake Vercel webhook self-registration
        continue-on-error: true
        env:
          SITE_URL: https://patricktechmedia.com
        run: |
          curl --fail --silent --show-error --location --user-agent "github-actions-newsroom-wake" "${SITE_URL%/}/vi/" > /dev/null

      - name: Pull production view snapshot
        continue-on-error: true
        env:
          SITE_URL: https://patricktechmedia.com
          PLATFORM_STATE_PATH: data/platform-state.json
        run: npm run platform:views:sync

      - name: Discover new technology feeds once per day
        if: ${{ github.event_name == 'schedule' && github.event.schedule == '17 0 * * *' }}
        continue-on-error: true
        env:
          NEWSROOM_DISCOVERY_LIMIT: "200"
          NEWSROOM_DISCOVERED_SOURCE_REGISTRY: data/newsroom-discovered-sources.json
        run: npm run newsroom:discover-sources

      - name: Run OpenClaw manager
        env:
          NEWSROOM_PULL_URL: ${{ secrets.NEWSROOM_PULL_URL }}
          NEWSROOM_PULL_TOKEN: ${{ secrets.NEWSROOM_PULL_TOKEN }}
          NEWSROOM_SINGLE_URL: ${{ github.event.inputs.article_url || '' }}
          NEWSROOM_AUDIT_REPAIR: ${{ github.event.inputs.repair_audit || '' }}
          NEWSROOM_REQUIRE_BILINGUAL_PAIR: ${{ github.event.inputs.publish_pair || '0' }}
          NEWSROOM_TRANSLATION_ENDPOINT: ${{ secrets.NEWSROOM_TRANSLATION_ENDPOINT }}
          NEWSROOM_TRANSLATION_API_KEY: ${{ secrets.NEWSROOM_TRANSLATION_API_KEY }}
          NEWSROOM_TRANSLATION_MODEL: ${{ secrets.NEWSROOM_TRANSLATION_MODEL }}
          NEWSROOM_GEMINI_API_KEY: ${{ secrets.NEWSROOM_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
          NEWSROOM_GEMINI_MODEL: ${{ secrets.NEWSROOM_GEMINI_MODEL || 'gemini-1.5-flash' }}
          NEWSROOM_GEMINI_LIMIT: "12"
          NEWSROOM_AUDIT_STRICT: "1"
          OPENCLAW_RUN_SOURCE: ${{ github.event.inputs.source || 'schedule' }}
          OPENCLAW_RUN_REASON: ${{ github.event.inputs.reason || 'scheduled' }}
          NEWSROOM_AUTOPUBLISH_STRICT: "1"
          NEWSROOM_AUTOPUBLISH_LIMIT: "12"
          NEWSROOM_AUTOPUBLISH_MIN_VI: "5"
          OPENCLAW_NEWSROOM_URL: ${{ secrets.OPENCLAW_NEWSROOM_URL }}
          OPENCLAW_NEWSROOM_TOKEN: ${{ secrets.OPENCLAW_NEWSROOM_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEWSROOM_CONTENT_PATH: data/newsroom-content.json
          OPENCLAW_WEB_STATE_PATH: data/openclaw-web-state.json
          OPENCLAW_LEARNING_STATE_PATH: data/openclaw-learning-state.json
          PLATFORM_STATE_PATH: data/platform-state.json
          OPENCLAW_MANAGER_STATE_PATH: data/openclaw-manager-state.json
          OPENCLAW_PENDING_QUEUE_PATH: data/openclaw-pending-clusters.json
          OPENCLAW_SOCIAL_SIGNALS_PATH: data/openclaw-social-signals.json
        run: node scripts/openclaw-manager.mjs

      - name: Run Social Autopilot (opt-in)
        env:
          SOCIAL_AUTOPILOT_ENABLED: ${{ secrets.SOCIAL_AUTOPILOT_ENABLED || '0' }}
          SOCIAL_AUTOPILOT_LIMIT: ${{ secrets.SOCIAL_AUTOPILOT_LIMIT || '1' }}
          SOCIAL_AUTOPILOT_ROTATE_TOPICS: ${{ secrets.SOCIAL_AUTOPILOT_ROTATE_TOPICS || '0' }}
          SOCIAL_AI_PROVIDER: ${{ secrets.SOCIAL_AI_PROVIDER || 'gemini' }}
          NEWSROOM_GEMINI_API_KEY: ${{ secrets.NEWSROOM_GEMINI_API_KEY || secrets.SOCIAL_AI_API_KEY || secrets.GEMINI_API_KEY }}
          SOCIAL_AI_API_KEY: ${{ secrets.SOCIAL_AI_API_KEY || secrets.NEWSROOM_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.NEWSROOM_GEMINI_API_KEY || secrets.SOCIAL_AI_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          TELEGRAM_NEWSROOM_BOT_TOKEN: ${{ secrets.TELEGRAM_NEWSROOM_BOT_TOKEN }}
          TELEGRAM_NEWSROOM_REPORT_CHAT_IDS: ${{ secrets.TELEGRAM_NEWSROOM_REPORT_CHAT_IDS }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEWSROOM_CONTENT_PATH: data/newsroom-content.json
          SOCIAL_STATE_PATH: data/social-posts.json
        run: npm run social:autopilot

      - name: Sync generated data to cloud storage
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEWSROOM_CONTENT_PATH: data/newsroom-content.json
          OPENCLAW_WEB_STATE_PATH: data/openclaw-web-state.json
          OPENCLAW_LEARNING_STATE_PATH: data/openclaw-learning-state.json
          PLATFORM_STATE_PATH: data/platform-state.json
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is not configured; skipping storage sync."
            exit 0
          fi
          npm run storage:sync

      - name: Verify and publish OpenClaw changes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENCLAW_GIT_AUTOPUSH: "1"
          OPENCLAW_GIT_USER_NAME: "github-actions[bot]"
          OPENCLAW_GIT_USER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
          OPENCLAW_GIT_COMMIT_MESSAGE: "Run OpenClaw manager cycle"
          OPENCLAW_GIT_SKIP_TESTS: "1"
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "DATABASE_URL is configured; skipping generated git commit-back."
            exit 0
          fi
          node scripts/openclaw-git-sync.mjs

      - name: Report newsroom status to Telegram
        if: ${{ always() }}
        continue-on-error: true
        env:
          TELEGRAM_NEWSROOM_BOT_TOKEN: ${{ secrets.TELEGRAM_NEWSROOM_BOT_TOKEN }}
          TELEGRAM_NEWSROOM_REPORT_CHAT_IDS: ${{ secrets.TELEGRAM_NEWSROOM_REPORT_CHAT_IDS }}
          SITE_URL: https://patricktechmedia.com
          NEWSROOM_CONTENT_PATH: data/newsroom-content.json
          OPENCLAW_MANAGER_STATE_PATH: data/openclaw-manager-state.json
          OPENCLAW_LEARNING_STATE_PATH: data/openclaw-learning-state.json
          OPENCLAW_PENDING_QUEUE_PATH: data/openclaw-pending-clusters.json
        run: |
          if [ -z "$TELEGRAM_NEWSROOM_BOT_TOKEN" ] || [ -z "$TELEGRAM_NEWSROOM_REPORT_CHAT_IDS" ]; then
            echo "Telegram report env is not configured; skipping report."
            exit 0
          fi
          node scripts/telegram-newsroom-report.mjs
